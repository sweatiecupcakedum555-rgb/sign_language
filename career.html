
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Career Advisor</title>

<style>
:root {
  --bg: #07090f;
  --panel: #10131b;
  --text: #eef0f7;
  --muted: #929bad;
  --accent: #7183e6;
  --line: #252c3b;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  background: #07090f;
  color: var(--text);
  font-family: Arial, sans-serif;
}

/* Main layout */
main {
  width: 100%;
  height: 100%;
  max-width: 850px;
  margin: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Title */
header {
  text-align: center;
  padding: 10px 5px;
  flex-shrink: 0;
}

h1 {
  font-size: 27px;
  margin: 0;
  color: var(--text);
}

/* Chat area */
#chatLog {
  flex: 1;
  min-height: 0;
  width: 100%;
  background: #111725;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;

  overflow-y: auto;
  overflow-x: hidden;

  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  overscroll-behavior: contain;
}

/* Messages */
.bubble {
  padding: 11px 14px;
  border-radius: 12px;
  margin: 9px 0;
  max-width: 96%;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.5;
}

.assistant {
  background: #171e2c;
  margin-right: auto;
}

.user {
  background: #29345a;
  margin-left: auto;
}

.bubble p {
  margin: 5px 0;
}

/* Input */
.input-area {
  flex-shrink: 0;
  background: #10131b;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
}

textarea {
  display: block;
  width: 100%;
  height: 65px;
  padding: 11px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: #080b12;
  color: var(--text);
  font-family: Arial, sans-serif;
  font-size: 14px;
  resize: none;
  outline: none;
}

textarea::placeholder {
  color: var(--muted);
}

textarea:focus {
  border-color: var(--accent);
}

/* Send button */
button {
  width: 100%;
  margin-top: 9px;
  border: none;
  border-radius: 9px;
  padding: 12px;
  background: var(--accent);
  color: #101426;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

/* Short screens */
@media (max-height: 500px) {
  header {
    padding: 4px;
  }

  h1 {
    font-size: 22px;
  }

  textarea {
    height: 48px;
  }
}
</style>
</head>

<body>

<main>

<header>
  <h1>AI Career Advisor</h1>
</header>

<div id="chatLog" aria-live="polite">
  <div class="bubble assistant">
    Hello! I'm your Career Advisor. What would you like to explore about work and careers?
  </div>
</div>

<div class="input-area">

<textarea
  id="chatInput"
  placeholder="Type your message here..."
></textarea>

<button id="sendBtn" type="button">Send</button>

</div>

</main>

<script>
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const chatLog = document.getElementById('chatLog');

const WORKER_URL =
  'https://career-advisor-api.sweatiecupcakedum555.workers.dev/';

function addMessage(message, className) {
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + className;

  if (className === 'assistant') {
    const lines = message.split('\n');

    lines.forEach(line => {
      const trimmed = line.trim();

      if (!trimmed) return;

      const p = document.createElement('p');

      const cleanLine = trimmed
        .replace(/^#{1,6}\s*/, '')
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/^\s*[-*]\s+/, '• ');

      p.textContent = cleanLine;
      bubble.appendChild(p);
    });
  } else {
    bubble.textContent = message;
  }

  chatLog.appendChild(bubble);
}

async function sendMessage() {
  const message = chatInput.value.trim();

  if (!message || sendBtn.disabled) return;

  addMessage(message, 'user');

  chatInput.value = '';
  sendBtn.disabled = true;
  sendBtn.textContent = 'Thinking...';

  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'AI request failed.');
    }

    const rawAnswer = data.answer;

    const answer = typeof rawAnswer === 'string'
      ? rawAnswer
      : Array.isArray(rawAnswer)
        ? rawAnswer.map(part => part.text || '').join('')
        : '';

    if (!answer.trim()) {
      throw new Error('The AI returned an empty response.');
    }

    addMessage(answer, 'assistant');

  } catch (error) {
    console.error('Career Advisor error:', error);

    addMessage(
      'Error: ' + error.message,
      'assistant'
    );

  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
  }
}

sendBtn.addEventListener('click', sendMessage);

chatInput.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>

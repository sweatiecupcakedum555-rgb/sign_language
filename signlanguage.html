<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Language Recognition</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>

body {
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 24px;
}

#webcam-container {
    margin: 20px auto;
    width: 300px;
    height: 300px;
}

#webcam-container canvas {
    width: 300px;
    height: 300px;
    border-radius: 15px;
}

#result-title {
    font-size: 18px;
    margin-top: 20px;
}

#result {
    font-size: 36px;
    font-weight: bold;
    margin-top: 10px;
}

#error {
    color: red;
    margin-top: 20px;
}

</style>

</head>

<body>

<h1>Sign Language Recognition</h1>

<div id="webcam-container"></div>

<div id="result-title">
    Recognized Sign:
</div>

<div id="result">
    Starting camera...
</div>

<div id="error"></div>


<script>

// =====================================================
// PUT YOUR TEACHABLE MACHINE MODEL URL HERE
// =====================================================

const MODEL_URL =
"https://teachablemachine.withgoogle.com/models/iraL4g45n/";


// =====================================================
// VARIABLES
// =====================================================

let model;
let webcam;

let maxPredictions;

let lastWord = "";
let candidateWord = "";

let stableFrames = 0;

const REQUIRED_STABLE_FRAMES = 3;

const CONFIDENCE_THRESHOLD = 0.75;


// =====================================================
// START THE APP AUTOMATICALLY
// =====================================================

window.addEventListener("load", function() {

    startApp();

});


// =====================================================
// START MODEL + CAMERA
// =====================================================

async function startApp() {

    try {

        document.getElementById("result").innerText =
            "Loading model...";


        // Load AI model

        const modelURL = MODEL_URL + "model.json";

        const metadataURL = MODEL_URL + "metadata.json";

        model = await tmImage.load(
            modelURL,
            metadataURL
        );

        maxPredictions = model.getTotalClasses();


        // Create webcam

        const flip = true;

        webcam = new tmImage.Webcam(
            300,
            300,
            flip
        );


        // Request camera

        await webcam.setup();


        // Start camera

        await webcam.play();


        // Put camera on screen

        document
            .getElementById("webcam-container")
            .appendChild(webcam.canvas);


        document.getElementById("result").innerText =
            "Show a sign";


        // Start recognition loop

        window.requestAnimationFrame(loop);

    }

    catch(error) {

        console.error(error);

        document.getElementById("result").innerText =
            "Camera error";

        document.getElementById("error").innerText =
            "Could not start the camera.";

    }

}


// =====================================================
// CONTINUOUS RECOGNITION
// =====================================================

async function loop() {

    webcam.update();

    await predict();

    window.requestAnimationFrame(loop);

}


// =====================================================
// AI PREDICTION
// =====================================================

async function predict() {

    const prediction =
        await model.predict(webcam.canvas);


    let highestProbability = 0;

    let highestClass = "";


    // Find the class with the highest probability

    for(let i = 0; i < maxPredictions; i++) {

        if(
            prediction[i].probability >
            highestProbability
        ) {

            highestProbability =
                prediction[i].probability;

            highestClass =
                prediction[i].className;

        }

    }


    // If confidence is too low

    if(
        highestProbability <
        CONFIDENCE_THRESHOLD
    ) {

        candidateWord = "";

        stableFrames = 0;

        return;

    }


    // Ignore the NOTHING class

    if(
        highestClass.toUpperCase() === "NOTHING"
    ) {

        candidateWord = "";

        stableFrames = 0;

        if(lastWord !== "") {

            lastWord = "";

            sendWordToApp("");

        }

        return;

    }


    // Check whether prediction stayed the same

    if(
        highestClass === candidateWord
    ) {

        stableFrames++;

    }

    else {

        candidateWord = highestClass;

        stableFrames = 1;

    }


    // Accept prediction after a few stable frames

    if(
        stableFrames >=
        REQUIRED_STABLE_FRAMES
    ) {

        if(
            highestClass !== lastWord
        ) {

            lastWord = highestClass;

            document.getElementById("result").innerText =
                highestClass;


            sendWordToApp(
                highestClass
            );

        }

    }

}


// =====================================================
// SEND WORD TO MIT APP INVENTOR
// =====================================================

function sendWordToApp(word) {

    if(
        window.AppInventor &&
        window.AppInventor.setWebViewString
    ) {

        window.AppInventor.setWebViewString(
            word
        );

    }

}

</script>

</body>
</html>

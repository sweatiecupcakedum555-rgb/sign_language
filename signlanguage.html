<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Sign Language Translator</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 28px;
            margin: 20px 10px;
        }

        #cameraContainer {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        #video {
            width: 90%;
            max-width: 400px;
            height: auto;
            background: black;
            border-radius: 10px;
            object-fit: cover;
        }

        #resultTitle {
            margin-top: 25px;
            font-size: 22px;
        }

        #result {
            margin-top: 10px;
            font-size: 40px;
            font-weight: bold;
            min-height: 55px;
        }

        #status {
            margin-top: 10px;
            font-size: 16px;
            color: #cccccc;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: white;
            color: black;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <h1>SIGN LANGUAGE TRANSLATOR</h1>

    <div id="cameraContainer">
        <video id="video" autoplay playsinline></video>
    </div>

    <button id="switchButton">Switch Camera</button>

    <div id="resultTitle">
        Recognised Sign:
    </div>

    <div id="result">
        Loading model...
    </div>

    <div id="status">
        Starting camera...
    </div>


<script>

    // =========================================================
    // YOUR TEACHABLE MACHINE MODEL
    // =========================================================

    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/y6rWUQuIT/";



    // =========================================================
    // VARIABLES
    // =========================================================

    let model;
    let video;
    let stream;

    let usingFrontCamera = true;

    let lastWord = "";
    let stableWord = "";
    let stableCount = 0;

    const STABLE_FRAMES = 3;
    const CONFIDENCE_THRESHOLD = 0.75;



    // =========================================================
    // START
    // =========================================================

    window.onload = async function () {

        video = document.getElementById("video");

        document.getElementById("switchButton")
            .addEventListener("click", switchCamera);

        try {

            document.getElementById("status").innerText =
                "Loading model...";

            model = await tmImage.load(
                MODEL_URL + "model.json",
                MODEL_URL + "metadata.json"
            );

            document.getElementById("status").innerText =
                "Starting camera...";

            await startCamera();

        } catch (error) {

            console.error(error);

            document.getElementById("result").innerText =
                "Error";

            document.getElementById("status").innerText =
                "Could not load model.";
        }
    };



    // =========================================================
    // START CAMERA
    // =========================================================

    async function startCamera() {

        try {

            // Stop previous camera
            if (stream) {

                stream.getTracks().forEach(function(track) {
                    track.stop();
                });

            }


            // FRONT CAMERA
            if (usingFrontCamera) {

                stream = await navigator.mediaDevices.getUserMedia({

                    video: {
                        facingMode: "user",
                        width: {
                            ideal: 640
                        },
                        height: {
                            ideal: 480
                        }
                    },

                    audio: false
                });

            }

            // BACK CAMERA
            else {

                stream = await navigator.mediaDevices.getUserMedia({

                    video: {
                        facingMode: {
                            ideal: "environment"
                        },
                        width: {
                            ideal: 640
                        },
                        height: {
                            ideal: 480
                        }
                    },

                    audio: false
                });

            }


            video.srcObject = stream;

            await video.play();


            // Mirror front camera
            if (usingFrontCamera) {

                video.style.transform = "scaleX(-1)";

            } else {

                video.style.transform = "scaleX(1)";

            }


            document.getElementById("status").innerText =
                usingFrontCamera
                ? "Front camera"
                : "Back camera";


            // Start recognition
            requestAnimationFrame(predictLoop);

        }

        catch (error) {

            console.error(error);

            document.getElementById("result").innerText =
                "Camera error";

            document.getElementById("status").innerText =
                "Could not start camera.";

        }
    }



    // =========================================================
    // SWITCH CAMERA
    // =========================================================

    async function switchCamera() {

        usingFrontCamera = !usingFrontCamera;

        document.getElementById("status").innerText =
            "Switching camera...";

        await startCamera();
    }



    // =========================================================
    // RECOGNITION LOOP
    // =========================================================

    async function predictLoop() {

        if (!model || !video) {

            requestAnimationFrame(predictLoop);

            return;
        }


        if (video.readyState >= 2) {

            try {

                const predictions =
                    await model.predict(video);


                let bestPrediction = null;


                // Find highest probability
                for (let i = 0; i < predictions.length; i++) {

                    if (
                        bestPrediction === null ||
                        predictions[i].probability >
                        bestPrediction.probability
                    ) {

                        bestPrediction = predictions[i];

                    }
                }


                if (bestPrediction) {

                    let word =
                        bestPrediction.className;

                    let probability =
                        bestPrediction.probability;


                    // Ignore weak predictions
                    if (probability < CONFIDENCE_THRESHOLD) {

                        word = "NOTHING";

                    }


                    // Ignore NOTHING
                    if (word === "NOTHING") {

                        stableWord = "";
                        stableCount = 0;

                    }

                    else {

                        // Check if same prediction continues
                        if (word === stableWord) {

                            stableCount++;

                        }

                        else {

                            stableWord = word;
                            stableCount = 1;

                        }


                        // Only accept stable prediction
                        if (stableCount >= STABLE_FRAMES) {

                            if (word !== lastWord) {

                                lastWord = word;

                                document.getElementById("result")
                                    .innerText = word;


                                // Send word to MIT App Inventor
                                if (
                                    window.AppInventor &&
                                    window.AppInventor.setWebViewString
                                ) {

                                    window.AppInventor
                                        .setWebViewString(word);

                                }

                            }

                        }

                    }

                }

            }

            catch (error) {

                console.error(error);

            }

        }


        requestAnimationFrame(predictLoop);

    }

</script>

</body>
</html>
